<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QueimadaBall</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="menu" class="panel">
    <h1>🔥 QueimadaBall</h1>
    <p>6 contra 6 • estilo HaxBall • até 12 jogadores</p>
    <label>Seu nome
      <input id="nameInput" maxlength="16" value="Jogador" autocomplete="name">
    </label>
    <button id="createBtn" class="primary">Criar sala</button>
    <div class="join-row">
      <input id="roomInput" maxlength="32" placeholder="Código da sala" aria-label="Código da sala">
      <button id="joinBtn">Entrar</button>
    </div>
    <p id="status" role="status">Pronto para jogar</p>
  </div>

  <section id="lobby" class="panel lobby-panel" hidden>
    <h1>🏟️ Sala de espera</h1>
    <p id="lobbyRoom"></p>
    <div id="lobbyRoster" class="lobby-roster"></div>
    <div id="hostLobbyControls" hidden>
      <div class="lobby-actions">
        <button id="addBotBtn">Adicionar bot</button>
        <button id="removeBotBtn">Remover bot</button>
        <button id="shuffleBtn">Misturar times</button>
      </div>
      <p id="botCount"></p>
      <button id="startBtn" class="primary">Iniciar partida</button>
    </div>
    <p id="lobbyStatus" role="status"></p>
    <button id="lobbyCopyBtn">Copiar convite</button>
  </section>

  <main id="gameShell" hidden>
    <div id="topbar">
      <span id="roomInfo"></span>
      <span id="score">AZUL 0 — 0 VERMELHO</span>
      <span id="abilityStatus">SHIFT/E: defender</span>
      <button id="restartBtn" hidden>Reiniciar partida</button>
      <button id="copyBtn">Copiar convite</button>
    </div>
    <div id="canvasWrap">
      <canvas id="game" width="1000" height="520"></canvas>
      <div id="mobileControls">
        <div id="joystick"><div id="stick"></div></div>
        <div class="action-buttons">
          <button id="defendBtn">DEFENDER</button>
          <button id="throwBtn">ARREMESSAR</button>
        </div>
      </div>
    </div>
  </main>

  <script src="peerjs.min.js?v=20261127a"></script>
  <script src="app.js?v=20261127a"></script>
</body>
</html>
